<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Printable Complaint Letter Template</title>
<link rel="stylesheet" href="../../site/css/print.css">
</head>
<body>
<div class="page">
<header class="letterhead">
<h1>Complaint Letter</h1>
<p class="note">Fill in all brackets, review carefully, then print or send.</p>
</header>

<form class="letter-body" autocomplete="off">
<div class="field-row">
<label for="sender-name">Your name</label>
<input type="text" id="sender-name" placeholder="Your full name">
</div>
<div class="field-row">
<label for="sender-address">Your address (optional for email)</label>
<input type="text" id="sender-address" placeholder="Street, City, State ZIP">
</div>
<div class="field-row">
<label for="sender-contact">Email or phone</label>
<input type="text" id="sender-contact" placeholder="email@example.com or 555-000-0000">
</div>
<div class="field-row">
<label for="date">Date</label>
<input type="date" id="date">
</div>

<hr class="sep">

<div class="field-row">
<label for="recipient-name">Company name</label>
<input type="text" id="recipient-name" placeholder="Company or organization name">
</div>
<div class="field-row">
<label for="recipient-address">Company address or department</label>
<input type="text" id="recipient-address" placeholder="Department or mailing address">
</div>

<hr class="sep">

<div class="field-row">
<label for="ref">Re: Complaint regarding</label>
<input type="text" id="ref" placeholder="Order/account number (last 4 digits only if unsure)">
</div>

<div class="field-row">
<label for="salutation">Dear</label>
<input type="text" id="salutation" placeholder="Contact Name or Customer Service Team">
</div>

<div class="field-row textarea-row">
<label for="what-happened">What happened (1–2 sentences)</label>
<textarea id="what-happened" rows="3" placeholder="Describe the issue: what went wrong, what product/service, etc."></textarea>
</div>
<div class="field-row">
<label for="incident-date">Date of incident</label>
<input type="date" id="incident-date">
</div>
<div class="field-row">
<label for="order-ref">Order/account reference</label>
<input type="text" id="order-ref" placeholder="Same as above or more detail">
</div>

<div class="field-row textarea-row">
<label for="facts">Specific facts (bullet points)</label>
<textarea id="facts" rows="4" placeholder="- Fact 1: what happened
- Fact 2: when and where
- Fact 3: steps you already took"></textarea>
</div>

<div class="field-row textarea-row">
<label for="impact">Impact on you</label>
<textarea id="impact" rows="2" placeholder="Money lost, time wasted, inconvenience, etc."></textarea>
</div>

<div class="field-row textarea-row">
<label for="requested-action">What you want</label>
<textarea id="requested-action" rows="2" placeholder="Refund, replacement, repair, correction, apology — be exact."></textarea>
</div>
<div class="field-row">
<label for="response-deadline">Please respond by</label>
<input type="date" id="response-deadline">
</div>

<hr class="sep">

<div class="closing">
<p>Thank you for your help.</p>
<p>Sincerely,</p>
<div class="signature-line"></div>
<p id="signed-name"></p>
<p id="signed-contact"></p>
</div>
</form>

<footer class="page-footer">
<p>Published by Asdale Dynamics, LLC · MIT License · Copyright (c) 2026 Asdale Dynamics, LLC</p>
<p>This template is for education only — not legal advice. Review before sending.</p>
</footer>
</div>

<script>
document.getElementById('date').valueAsDate = new Date();
const responseDate = new Date();
responseDate.setDate(responseDate.getDate() + 14);
document.getElementById('response-deadline').valueAsDate = responseDate;

['sender-name','sender-contact'].forEach(id => {
  document.getElementById(id).addEventListener('input', () => {
    document.getElementById('signed-name').textContent = document.getElementById('sender-name').value;
    document.getElementById('signed-contact').textContent = document.getElementById('sender-contact').value;
  });
});
</script>
</body>
</html>
